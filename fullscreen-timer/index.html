<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fullscreen Timer - Discipline Tracker Pro</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='48' x='8' font-size='48'%3E%E2%8F%B1%EF%B8%8F%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      --bg: #0d0d0d;
      --bg-elevated: #1a1a1a;
      --fg: #f5f5f5;
      --fg-muted: #a0a0a0;
      --accent: #00d4aa;
      --accent-dim: #00d4aa33;
      --danger: #ff4757;
      --danger-dim: #ff475733;
      --warning: #ffa502;
      --card-border: #2a2a2a;
      --shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8f9fa;
        --bg-elevated: #ffffff;
        --fg: #1a1a2e;
        --fg-muted: #6c757d;
        --card-border: #dee2e6;
        --shadow: 0 8px 32px rgba(0,0,0,0.1);
      }
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }
    .timer-container {
      width: 100%;
      max-width: 600px;
      text-align: center;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 24px;
      transition: all 0.3s ease;
    }
    .status-badge.running {
      background: var(--accent-dim);
      color: var(--accent);
      box-shadow: 0 0 20px var(--accent-dim);
    }
    .status-badge.paused {
      background: var(--warning);
      color: #1a1a1a;
    }
    .status-badge.stopped {
      background: var(--danger-dim);
      color: var(--danger);
    }
    .status-badge .pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 1.5s ease-in-out infinite;
    }
    .status-badge.paused .pulse,
    .status-badge.stopped .pulse {
      animation: none;
      opacity: 0.5;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }
    .task-info {
      margin-bottom: 24px;
      padding: 16px;
      background: var(--bg-elevated);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }
    .task-label {
      font-size: 0.75rem;
      color: var(--fg-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 4px;
    }
    .task-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--fg);
      word-break: break-word;
    }
    .task-meta {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 12px;
      font-size: 0.8rem;
      color: var(--fg-muted);
    }
    .timer-display {
      font-family: 'SF Mono', 'Fira Code', 'Monospace', monospace;
      font-size: clamp(4rem, 15vw, 8rem);
      font-weight: 300;
      letter-spacing: -0.02em;
      line-height: 1;
      margin: 24px 0;
      color: var(--fg);
      text-shadow: 0 0 40px var(--accent-dim);
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }
    .timer-display.running {
      color: var(--accent);
      text-shadow: 0 0 60px var(--accent-dim), 0 0 100px var(--accent-dim);
    }
    .controls {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 32px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      min-width: 140px;
      justify-content: center;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }
    .btn-primary {
      background: var(--accent);
      color: #0d0d0d;
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px var(--accent-dim);
    }
    .btn-danger {
      background: var(--danger);
      color: white;
    }
    .btn-danger:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px var(--danger-dim);
    }
    .btn-secondary {
      background: var(--bg-elevated);
      color: var(--fg);
      border: 1px solid var(--card-border);
    }
    .btn-secondary:hover:not(:disabled) {
      background: var(--card-border);
      transform: translateY(-2px);
    }
    .btn-warning {
      background: var(--warning);
      color: #1a1a1a;
    }
    .btn-warning:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(255,165,2,0.3);
    }
    .sync-status {
      margin-top: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.75rem;
      color: var(--fg-muted);
    }
    .sync-status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
    }
    .sync-status.connected .dot {
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }
    .sync-status.syncing .dot {
      background: var(--warning);
      animation: pulse 1s ease-in-out infinite;
    }
    .error-message {
      margin-top: 16px;
      padding: 12px 16px;
      background: var(--danger-dim);
      border: 1px solid var(--danger);
      border-radius: 8px;
      color: var(--danger);
      font-size: 0.85rem;
      display: none;
    }
    .error-message.visible {
      display: block;
    }
    .keyboard-hints {
      margin-top: 32px;
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      font-size: 0.7rem;
      color: var(--fg-muted);
    }
    .kbd {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: var(--bg-elevated);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      font-family: inherit;
    }
    .kbd kbd {
      font-family: inherit;
      font-size: 0.7rem;
      padding: 1px 6px;
      background: var(--card-border);
      border-radius: 3px;
    }
    .fullscreen-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
    }
    .fullscreen-toggle .btn {
      min-width: auto;
      padding: 10px 16px;
      font-size: 0.85rem;
    }
    @media (max-width: 480px) {
      .timer-display {
        font-size: 3.5rem;
      }
      .btn {
        min-width: 120px;
        padding: 12px 20px;
      }
      .task-meta {
        flex-direction: column;
        gap: 4px;
      }
    }
  </style>
</head>
<body>
  <div class="fullscreen-toggle">
    <button class="btn btn-secondary" id="fullscreen-toggle-btn" title="Toggle Fullscreen (F)">
      <i class="fas fa-expand"></i> Fullscreen
    </button>
  </div>

  <div class="timer-container">
    <div class="status-badge stopped" id="status-badge">
      <span class="pulse"></span>
      <span id="status-text">Stopped</span>
    </div>

    <div class="task-info" id="task-info" style="display: none;">
      <div class="task-label">Active Task</div>
      <div class="task-name" id="task-name">—</div>
      <div class="task-meta">
        <span id="task-category">—</span>
        <span id="task-started">Started: —</span>
      </div>
    </div>

    <div class="timer-display stopped" id="timer-display">00:00:00</div>

    <div class="controls">
      <button class="btn btn-primary" id="start-btn" disabled>
        <i class="fas fa-play"></i> Start
      </button>
      <button class="btn btn-danger" id="stop-btn" disabled>
        <i class="fas fa-stop"></i> Stop
      </button>
      <button class="btn btn-warning" id="pause-btn" disabled>
        <i class="fas fa-pause"></i> Pause
      </button>
      <button class="btn btn-secondary" id="reset-btn" disabled>
        <i class="fas fa-undo"></i> Reset
      </button>
    </div>

    <div class="sync-status" id="sync-status">
      <span class="dot"></span>
      <span id="sync-text">Connecting to Firebase…</span>
    </div>

    <div class="error-message" id="error-message"></div>

    <div class="keyboard-hints">
      <div class="kbd"><kbd>Space</kbd> Start/Pause</div>
      <div class="kbd"><kbd>R</kbd> Reset</div>
      <div class="kbd"><kbd>F</kbd> Fullscreen</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, onSnapshot, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

    // Firebase config (must match main app)
    const firebaseConfig = {
      apiKey: "AIzaSyBIdVzFFqSlaHKfaob9_kcB_OgLJTCw9-M",
      authDomain: "discipline-tracker-e8e8a.firebaseapp.com",
      projectId: "discipline-tracker-e8e8a",
      storageBucket: "discipline-tracker-e8e8a.firebasestorage.app",
      messagingSenderId: "382793676796",
      appId: "1:382793676796:web:1a2f749697bf6cb68fe479",
    };

    // State
    let auth = null;
    let db = null;
    let unsubscribeTimer = null;
    let currentUser = null;
    let timerState = {
      status: 'stopped',
      startTime: null,
      elapsedBeforePause: 0,
      activeTask: null
    };
    let localElapsed = 0;
    let tickInterval = null;
    let isFullscreen = false;

    // DOM Elements
    const elements = {
      statusBadge: document.getElementById('status-badge'),
      statusText: document.getElementById('status-text'),
      taskInfo: document.getElementById('task-info'),
      taskName: document.getElementById('task-name'),
      taskCategory: document.getElementById('task-category'),
      taskStarted: document.getElementById('task-started'),
      timerDisplay: document.getElementById('timer-display'),
      startBtn: document.getElementById('start-btn'),
      stopBtn: document.getElementById('stop-btn'),
      pauseBtn: document.getElementById('pause-btn'),
      resetBtn: document.getElementById('reset-btn'),
      syncStatus: document.getElementById('sync-status'),
      syncText: document.getElementById('sync-text'),
      errorMessage: document.getElementById('error-message'),
      fullscreenToggleBtn: document.getElementById('fullscreen-toggle-btn'),
    };

    // Format milliseconds to HH:MM:SS
    function formatTime(ms) {
      const h = Math.floor(ms / 3600000);
      const m = Math.floor((ms % 3600000) / 60000);
      const s = Math.floor((ms % 60000) / 1000);
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    // Format timestamp to HH:MM AM/PM
    function formatTimestamp(ts) {
      if (!ts) return '—';
      const d = new Date(ts);
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    // Update UI based on timer state
    function updateUI() {
      const { status, activeTask, startTime, elapsedBeforePause } = timerState;

      // Update status badge
      elements.statusBadge.className = `status-badge ${status}`;
      elements.statusText.textContent = status.charAt(0).toUpperCase() + status.slice(1);

      // Update timer display
      elements.timerDisplay.className = `timer-display ${status}`;
      elements.timerDisplay.textContent = formatTime(localElapsed);

      // Update task info
      if (activeTask) {
        elements.taskInfo.style.display = 'block';
        elements.taskName.textContent = activeTask.name || activeTask.description || `${activeTask.category} - ${activeTask.subcategory}`;
        elements.taskCategory.textContent = `${activeTask.category} / ${activeTask.subcategory}`;
        elements.taskStarted.textContent = `Started: ${formatTimestamp(startTime)}`;
      } else {
        elements.taskInfo.style.display = 'none';
      }

      // Update button states
      elements.startBtn.disabled = status === 'running';
      elements.stopBtn.disabled = status === 'stopped';
      elements.pauseBtn.disabled = status !== 'running';
      elements.pauseBtn.innerHTML = status === 'paused' 
        ? '<i class="fas fa-play"></i> Resume' 
        : '<i class="fas fa-pause"></i> Pause';
      elements.resetBtn.disabled = status === 'stopped' && localElapsed === 0;
    }

    // Calculate current elapsed time
    function calculateElapsed() {
      if (timerState.status === 'running' && timerState.startTime) {
        return timerState.elapsedBeforePause + (Date.now() - timerState.startTime);
      }
      return timerState.elapsedBeforePause;
    }

    // Start local tick interval
    function startTicking() {
      if (tickInterval) clearInterval(tickInterval);
      tickInterval = setInterval(() => {
        localElapsed = calculateElapsed();
        elements.timerDisplay.textContent = formatTime(localElapsed);
      }, 500); // Update twice per second for smooth display
    }

    function stopTicking() {
      if (tickInterval) {
        clearInterval(tickInterval);
        tickInterval = null;
      }
    }

    // Sync timer state to Firestore
    async function syncTimerToCloud(newState) {
      if (!db || !currentUser) return;
      try {
        const timerRef = doc(db, 'users', currentUser.uid, 'state', 'timer');
        await setDoc(timerRef, newState, { merge: true });
      } catch (e) {
        console.warn('Timer sync to cloud failed:', e);
        showError('Failed to sync timer to cloud');
      }
    }

    // Start timer (locally and in cloud)
    async function startTimer(taskName = null, meta = null) {
      if (timerState.status === 'running') return;
      if (!currentUser) {
        showError('Please sign in to use the timer');
        return;
      }

      // If no task provided, prompt for one
      let name = taskName;
      let resolvedMeta = meta;

      if (!name && !resolvedMeta) {
        name = prompt('Enter task name:');
        if (!name) return;
        const category = prompt('Category (Productive Work / Study / Physical Training / Time Waste / Sleep / Miscellaneous):', 'Productive Work');
        if (!category) return;
        const subcategory = prompt(`Subcategory for ${category}:`, 'General');
        if (!subcategory) return;
        resolvedMeta = { category, subcategory, description: name };
      }

      const startTime = Date.now();
      timerState = {
        status: 'running',
        startTime,
        elapsedBeforePause: 0,
        activeTask: {
          name: name || resolvedMeta.subcategory,
          startTime,
          ...resolvedMeta
        }
      };

      localElapsed = 0;
      startTicking();
      updateUI();
      await syncTimerToCloud(timerState);
    }

    // Pause timer
    async function pauseTimer() {
      if (timerState.status !== 'running') return;

      localElapsed = calculateElapsed();
      timerState = {
        ...timerState,
        status: 'paused',
        elapsedBeforePause: localElapsed,
        startTime: null
      };

      stopTicking();
      updateUI();
      await syncTimerToCloud(timerState);
    }

    // Resume timer
    async function resumeTimer() {
      if (timerState.status !== 'paused') return;

      const startTime = Date.now();
      timerState = {
        ...timerState,
        status: 'running',
        startTime,
        // elapsedBeforePause stays the same
      };

      startTicking();
      updateUI();
      await syncTimerToCloud(timerState);
    }

    // Stop timer and save as completed task
    async function stopTimer() {
      if (timerState.status === 'stopped') return;

      localElapsed = calculateElapsed();

      // Save as completed task if there's an active task and meaningful duration
      if (timerState.activeTask && localElapsed > 60000) {
        try {
          const taskRef = doc(db, 'users', currentUser.uid, 'tasks', String(Date.now()));
          await setDoc(taskRef, {
            id: String(Date.now()),
            ...timerState.activeTask,
            startTime: timerState.startTime || timerState.activeTask.startTime,
            endTime: Date.now(),
            duration: Math.max(1, Math.round(localElapsed / 60000)),
            date: new Date().toISOString().split('T')[0],
            updatedAt: Date.now(),
          }, { merge: true });
        } catch (e) {
          console.warn('Failed to save completed task:', e);
        }
      }

      timerState = {
        status: 'stopped',
        startTime: null,
        elapsedBeforePause: 0,
        activeTask: null
      };

      localElapsed = 0;
      stopTicking();
      updateUI();
      await syncTimerToCloud(timerState);
    }

    // Reset timer (clear without saving)
    function resetTimer() {
      if (timerState.status === 'running') return; // Can't reset while running

      timerState = {
        status: 'stopped',
        startTime: null,
        elapsedBeforePause: 0,
        activeTask: null
      };

      localElapsed = 0;
      stopTicking();
      updateUI();
      syncTimerToCloud(timerState);
    }

    // Listen to timer state from Firestore
    function listenToTimerState() {
      if (!db || !currentUser) return;

      const timerRef = doc(db, 'users', currentUser.uid, 'state', 'timer');

      // Update sync status
      elements.syncStatus.className = 'sync-status syncing';
      elements.syncText.textContent = 'Syncing…';

      unsubscribeTimer = onSnapshot(timerRef, (snap) => {
        elements.syncStatus.className = 'sync-status connected';
        elements.syncText.textContent = 'Synced';

        if (!snap.exists()) {
          // No timer state in cloud, use local
          return;
        }

        const cloudState = snap.data();
        
        // If cloud says running and we're not, resume from cloud
        if (cloudState.status === 'running' && timerState.status !== 'running') {
          const cloudStartTime = Number(cloudState.startTime);
          const cloudElapsedBeforePause = Number(cloudState.elapsedBeforePause || 0);
          
          if (cloudStartTime && cloudState.activeTask) {
            timerState = {
              status: 'running',
              startTime: cloudStartTime,
              elapsedBeforePause: cloudElapsedBeforePause,
              activeTask: cloudState.activeTask
            };
            localElapsed = calculateElapsed();
            startTicking();
            updateUI();
          }
        }
        // If cloud says paused and we're running, pause locally
        else if (cloudState.status === 'paused' && timerState.status === 'running') {
          localElapsed = calculateElapsed();
          timerState = {
            ...timerState,
            status: 'paused',
            elapsedBeforePause: localElapsed,
            startTime: null
          };
          stopTicking();
          updateUI();
        }
        // If cloud says stopped and we're not, stop locally
        else if (cloudState.status === 'stopped' && timerState.status !== 'stopped') {
          timerState = {
            status: 'stopped',
            startTime: null,
            elapsedBeforePause: 0,
            activeTask: null
          };
          localElapsed = 0;
          stopTicking();
          updateUI();
        }
      }, (err) => {
        console.warn('Timer listener error:', err);
        elements.syncStatus.className = 'sync-status';
        elements.syncText.textContent = 'Sync error - using local only';
      });
    }

    // Initialize Firebase
    async function initFirebase() {
      try {
        const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);

        // Enable offline persistence
        try {
          await enableIndexedDbPersistence(db);
        } catch (e) {
          console.warn('Persistence error:', e);
        }

        // Wait for auth state
        return new Promise((resolve) => {
          onAuthStateChanged(auth, async (user) => {
            if (user) {
              currentUser = user;
              console.log('Signed in as:', user.uid);
              listenToTimerState();
              
              // Also check for existing timer state on load
              const timerRef = doc(db, 'users', user.uid, 'state', 'timer');
              const snap = await getDoc(timerRef);
              if (snap.exists()) {
                const cloudState = snap.data();
                if (cloudState.status === 'running' && cloudState.startTime && cloudState.activeTask) {
                  timerState = {
                    status: 'running',
                    startTime: Number(cloudState.startTime),
                    elapsedBeforePause: Number(cloudState.elapsedBeforePause || 0),
                    activeTask: cloudState.activeTask
                  };
                  localElapsed = calculateElapsed();
                  startTicking();
                } else if (cloudState.status === 'paused') {
                  timerState = {
                    status: 'paused',
                    startTime: null,
                    elapsedBeforePause: Number(cloudState.elapsedBeforePause || 0),
                    activeTask: cloudState.activeTask
                  };
                  localElapsed = timerState.elapsedBeforePause;
                }
              }
              updateUI();
            } else {
              // Try anonymous sign-in for unauthenticated users
              try {
                await signInAnonymously(auth);
              } catch (e) {
                console.warn('Anonymous sign-in failed:', e);
                showError('Firebase auth failed. Timer will work locally only.');
                updateUI();
              }
            }
            resolve();
          });
        });
      } catch (e) {
        console.error('Firebase init failed:', e);
        showError('Firebase initialization failed. Timer works locally only.');
        updateUI();
      }
    }

    // Show error message
    function showError(msg) {
      elements.errorMessage.textContent = msg;
      elements.errorMessage.classList.add('visible');
      setTimeout(() => elements.errorMessage.classList.remove('visible'), 5000);
    }

    // Fullscreen handling
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(console.warn);
        elements.fullscreenToggleBtn.innerHTML = '<i class="fas fa-compress"></i> Exit Fullscreen';
      } else {
        document.exitFullscreen().catch(console.warn);
        elements.fullscreenToggleBtn.innerHTML = '<i class="fas fa-expand"></i> Fullscreen';
      }
    }

    document.addEventListener('fullscreenchange', () => {
      isFullscreen = !!document.fullscreenElement;
      elements.fullscreenToggleBtn.innerHTML = isFullscreen
        ? '<i class="fas fa-compress"></i> Exit Fullscreen'
        : '<i class="fas fa-expand"></i> Fullscreen';
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      // Ignore if typing in input
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

      switch (e.key) {
        case ' ':
          e.preventDefault();
          if (timerState.status === 'running') pauseTimer();
          else if (timerState.status === 'paused') resumeTimer();
          else startTimer();
          break;
        case 'r':
        case 'R':
          if (timerState.status !== 'running') resetTimer();
          break;
        case 'f':
        case 'F':
          toggleFullscreen();
          break;
      }
    });

    // Button event listeners
    elements.startBtn.addEventListener('click', () => startTimer());
    elements.pauseBtn.addEventListener('click', () => {
      if (timerState.status === 'running') pauseTimer();
      else if (timerState.status === 'paused') resumeTimer();
    });
    elements.stopBtn.addEventListener('click', stopTimer);
    elements.resetBtn.addEventListener('click', resetTimer);
    elements.fullscreenToggleBtn.addEventListener('click', toggleFullscreen);

    // Handle page unload - sync final state
    window.addEventListener('beforeunload', () => {
      if (timerState.status === 'running') {
        localElapsed = calculateElapsed();
        timerState = {
          ...timerState,
          status: 'paused',
          elapsedBeforePause: localElapsed,
          startTime: null
        };
        syncTimerToCloud(timerState);
      }
    });

    // Initialize
    initFirebase().then(() => {
      updateUI();
    });
  </script>
</body>
</html>
